<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poland Role Pipeline</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f6f5;
    --surface: #ffffff;
    --ink: #16211e;
    --muted: #5d6b66;
    --line: #dce3e0;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #12171a;
      --surface: #1a2125;
      --ink: #e7eeeb;
      --muted: #95a39e;
      --line: #2b353a;
      --accent: #5cc0a4;
      --accent-ink: #07231d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 24px 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 440px;
    width: 100%;
  }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }
  a.go {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 9px;
    padding: 13px 20px;
    min-height: 48px;
    width: 100%;
  }
  .fine { font-size: 12.5px; margin: 16px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <h1>Poland Role Pipeline</h1>
    <p>The job search moved. Roles are tracked in a live pipeline you can flag and come back to, refreshed every 12 hours.</p>
    <a class="go" href="https://claude.ai/artifact/ARMFpqehuWJmojGwnqMAFB">Open the pipeline &rarr;</a>
    <p class="fine">If you are not redirected automatically, use the button above. Sign in with the Claude account that owns the pipeline.</p>
  </main>
</body>
</html>
