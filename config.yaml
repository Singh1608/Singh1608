# job_scraper configuration
#
# search: filters applied to every posting found across all companies.
# companies: the list of companies to scrape. Each entry is one of:
#   1. Slug only (preferred) -- the scraper probes every known ATS until it
#      finds the company's board. Use this when you know the company but not
#      which ATS it runs, which is almost always.
#        - {name: Acme Corp, slug: acme}
#   2. platform + slug, when you already know the ATS. Skips probing.
#        - name: Acme Corp
#          platform: greenhouse   # greenhouse | lever | ashby | smartrecruiters
#                                 # | recruitee | personio | teamtailor
#          slug: acme
#   3. careers_url -- looks for an ATS link in the page, else falls back to
#      scraping the HTML. Works poorly in practice: most career pages are
#      JavaScript apps whose job lists are not in the HTML we fetch. Prefer 1.
#        - name: Acme Corp
#          careers_url: https://acme.com/careers

search:
  # Poland-based (or Poland-eligible remote) roles. Extend freely --
  # e.g. add specific cities you'd consider, or "EMEA" if you want to also
  # catch broader-region remote postings that may include Poland.
  location_keywords:
    - poland
    - warsaw
    - warszawa
    - krakow
    - kraków
    - wroclaw
    - wrocław
    - gdansk
    - gdańsk
    - gdynia
    - poznan
    - poznań
    - lodz
    - łódź
    - katowice
    - remote - poland
    - remote (poland)
    - remote, poland
    - emea remote

  # Only keep postings whose text reads as English (heuristic, see
  # job_scraper/filters.py) -- filters out Polish-only listings.
  english_only: true

  # Drop postings that explicitly demand Polish fluency, even if the rest
  # of the listing is in English.
  exclude_if_requires_polish: true

  # Matched as loose substrings against the job title only. Tuned to a
  # Consultant / Senior Consultant / Senior Associate band, industry-agnostic,
  # covering core consulting/strategy plus three adjacencies: chief of staff
  # & business management, PMO & programme management, and process /
  # operational excellence.
  role_keywords:
    # Core consulting & strategy
    - consultant
    - consulting
    - senior associate
    - corporate strategy
    - business strategy
    - commercial strategy
    - strategy analyst
    - strategic planning
    - strategy & operations
    - strategy and operations
    - corporate development
    # Transformation
    - transformation
    - target operating model
    - change management
    # Business analysis
    - business analyst
    - business analysis
    # Chief of staff & business management
    - chief of staff
    - business manager
    - business management
    - business operations
    # PMO & programme management
    - pmo
    - programme manager
    - program manager
    - programme management
    - program management
    - project manager
    # Process & operational excellence
    - process improvement
    - process excellence
    - operational excellence
    - continuous improvement
    - process analyst
    - business process
    - operations analyst

  # Negative filter on the title, matched on whole words (see
  # job_scraper/filters.py). This is what makes the loose role_keywords above
  # safe -- bare "consultant" would otherwise pull in every Sales, Recruitment
  # and Security Consultant posting in Poland.
  exclude_title_keywords:
    # Above your band. NOTE: bare "manager" is deliberately NOT excluded --
    # it would kill the Programme/Project/Business Manager roles you asked to
    # keep, where "Manager" is a peer-level title rather than a consulting
    # grade. Add "- manager" here to enforce the band strictly.
    - senior manager
    - engagement manager
    - head
    - director
    - vp
    - vice president
    - partner
    - principal
    - executive
    - president
    # Below your band
    - intern
    - internship
    - trainee
    - apprentice
    - junior
    - graduate programme
    - graduate program
    - working student
    - entry level
    - praktykant
    - staz
    # Wrong track entirely
    - sales
    - recruitment
    - recruiter
    - talent acquisition
    - customer service
    - account executive
    - security
    - cyber
    - software engineer
    - developer
    - tax
    - audit
    - legal
    - clinical
    - medical
    - nurse

companies:
  # Direct ATS lookups only. Giving just a slug makes the scraper probe every
  # known ATS until it finds the company's board -- a wrong guess costs one
  # fast 404, and the per-company panel shows exactly which slugs resolved.
  #
  # careers_url entries were removed deliberately: most company career pages
  # are JavaScript apps whose job lists never appear in the HTML we fetch, so
  # that path found almost nothing. ATS APIs are plain JSON and need no JS.
  #
  # These slugs are educated guesses, not verified. Expect a chunk to miss;
  # delete the ones that report "no board found" and keep the rest.

  # Polish companies / Poland HQ
  - {name: DocPlanner, slug: docplanner}
  - {name: Booksy, slug: booksy}
  - {name: Brainly, slug: brainly}
  - {name: Netguru, slug: netguru}
  - {name: Tidio, slug: tidio}
  - {name: Packhelp, slug: packhelp}
  - {name: Infermedica, slug: infermedica}
  - {name: Spacelift, slug: spacelift}
  - {name: Vue Storefront, slug: vuestorefront}
  - {name: Zowie, slug: zowie}
  - {name: Nomagic, slug: nomagic}

  # International, with Poland offices
  - {name: Revolut, slug: revolut}
  - {name: Zalando, slug: zalando}
  - {name: Bolt, slug: bolt}
  - {name: Wolt, slug: wolt}
  - {name: Glovo, slug: glovo}
  - {name: HelloFresh, slug: hellofresh}
  - {name: Delivery Hero, slug: deliveryhero}
  - {name: Cloudflare, slug: cloudflare}
  - {name: SumUp, slug: sumup}
  - {name: N26, slug: n26}
  - {name: Klarna, slug: klarna}
  - {name: Wise, slug: wise}
  - {name: Spotify, slug: spotify}
  - {name: Trustpilot, slug: trustpilot}
  - {name: Adyen, slug: adyen}
  - {name: Backbase, slug: backbase}
  - {name: Personio, slug: personio}

  # Remote-first, hire in Poland
  - {name: GitLab, slug: gitlab}
  - {name: Automattic, slug: automattic}
  - {name: Canonical, slug: canonical}
  - {name: Grafana Labs, slug: grafanalabs}
  - {name: Elastic, slug: elastic}
  - {name: Remote, slug: remote}
  - {name: Deel, slug: deel}
  - {name: Toggl, slug: toggl}
  - {name: Doist, slug: doist}
  - {name: SmartRecruiters, slug: smartrecruiters}
