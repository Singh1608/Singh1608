# job_scraper configuration
#
# search: filters applied to every posting found across all companies.
# companies: the list of companies to scrape. Each entry is one of:
#   1. Fast path (preferred): platform + slug, when you already know the
#      company runs a known ATS. Skips detection entirely.
#        - name: Acme Corp
#          platform: greenhouse   # greenhouse | lever | ashby | smartrecruiters
#                                 # | recruitee | personio | teamtailor
#          slug: acme
#   2. Auto-detect: give the company's careers page URL and let the scraper
#      find an embedded/linked ATS board on it.
#        - name: Acme Corp
#          careers_url: https://acme.com/careers
#   3. If auto-detect finds no known ATS, the scraper automatically falls
#      back to the generic HTML/JSON-LD scraper on that same careers_url --
#      no extra config needed, but results are less reliable.

search:
  # Poland-based (or Poland-eligible remote) roles. Extend freely --
  # e.g. add specific cities you'd consider, or "EMEA" if you want to also
  # catch broader-region remote postings that may include Poland.
  location_keywords:
    - poland
    - warsaw
    - warszawa
    - krakow
    - kraków
    - wroclaw
    - wrocław
    - gdansk
    - gdańsk
    - gdynia
    - poznan
    - poznań
    - lodz
    - łódź
    - katowice
    - remote - poland
    - remote (poland)
    - remote, poland
    - emea remote

  # Only keep postings whose text reads as English (heuristic, see
  # job_scraper/filters.py) -- filters out Polish-only listings.
  english_only: true

  # Drop postings that explicitly demand Polish fluency, even if the rest
  # of the listing is in English.
  exclude_if_requires_polish: true

  # Matched as loose substrings against the job title only. Tuned to a
  # Consultant / Senior Consultant / Senior Associate band, industry-agnostic,
  # covering core consulting/strategy plus three adjacencies: chief of staff
  # & business management, PMO & programme management, and process /
  # operational excellence.
  role_keywords:
    # Core consulting & strategy
    - consultant
    - consulting
    - senior associate
    - corporate strategy
    - business strategy
    - commercial strategy
    - strategy analyst
    - strategic planning
    - strategy & operations
    - strategy and operations
    - corporate development
    # Transformation
    - transformation
    - target operating model
    - change management
    # Business analysis
    - business analyst
    - business analysis
    # Chief of staff & business management
    - chief of staff
    - business manager
    - business management
    - business operations
    # PMO & programme management
    - pmo
    - programme manager
    - program manager
    - programme management
    - program management
    - project manager
    # Process & operational excellence
    - process improvement
    - process excellence
    - operational excellence
    - continuous improvement
    - process analyst
    - business process
    - operations analyst

  # Negative filter on the title, matched on whole words (see
  # job_scraper/filters.py). This is what makes the loose role_keywords above
  # safe -- bare "consultant" would otherwise pull in every Sales, Recruitment
  # and Security Consultant posting in Poland.
  exclude_title_keywords:
    # Above your band. NOTE: bare "manager" is deliberately NOT excluded --
    # it would kill the Programme/Project/Business Manager roles you asked to
    # keep, where "Manager" is a peer-level title rather than a consulting
    # grade. Add "- manager" here to enforce the band strictly.
    - senior manager
    - engagement manager
    - head
    - director
    - vp
    - vice president
    - partner
    - principal
    - executive
    - president
    # Below your band
    - intern
    - internship
    - trainee
    - apprentice
    - junior
    - graduate programme
    - graduate program
    - working student
    - entry level
    - praktykant
    - staz
    # Wrong track entirely
    - sales
    - recruitment
    - recruiter
    - talent acquisition
    - customer service
    - account executive
    - security
    - cyber
    - software engineer
    - developer
    - tax
    - audit
    - legal
    - clinical
    - medical
    - nurse

companies:
  # STARTING LIST -- UNVERIFIED. These careers URLs were written without
  # network access to check them, so some will 404 or have moved. They use
  # the auto-detect path on purpose: give the scraper a careers page and it
  # finds the ATS behind it, which is far more robust than guessing ATS
  # slugs. Run `python3 main.py` and read the "returned nothing" summary at
  # the end to see which ones need their URL corrected or removed.
  #
  # Coverage caveat: the consulting firms and banks that fit your profile
  # best (Big 4, MBB, Citi, Goldman, ING, Nordea) mostly run Workday or
  # SuccessFactors, which this scraper does not support yet -- see README.
  # This list is therefore weighted to companies on supported platforms that
  # still hire strategy, transformation, bizops and PMO people.

  - name: SmartRecruiters
    platform: smartrecruiters
    slug: smartrecruiters

  # Polish companies / Polish HQ
  - name: DocPlanner
    careers_url: https://jobs.docplanner.tech/
  - name: Allegro
    careers_url: https://allegro.pl/kariera
  - name: Booksy
    careers_url: https://booksy.com/careers/
  - name: Brainly
    careers_url: https://brainly.co/careers/
  - name: InPost
    careers_url: https://inpost.pl/kariera
  - name: Netguru
    careers_url: https://www.netguru.com/career
  - name: STX Next
    careers_url: https://www.stxnext.com/careers/

  # International companies with Poland offices
  - name: Revolut
    careers_url: https://www.revolut.com/careers/
  - name: Zalando
    careers_url: https://jobs.zalando.com/en/jobs
  - name: Bolt
    careers_url: https://bolt.eu/en/careers/
  - name: Wolt
    careers_url: https://careers.wolt.com/en/jobs
  - name: Glovo
    careers_url: https://jobs.glovoapp.com/
  - name: HelloFresh
    careers_url: https://careers.hellofresh.com/global/en/search-results
  - name: Delivery Hero
