[project]
name = "tender-ai"
version = "1.0.0"
description = "AI tender analysis, win-probability, profit forecasting and procurement workflow automation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
