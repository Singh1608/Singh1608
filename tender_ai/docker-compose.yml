services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tender_ai
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender_ai"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      TENDER_DATABASE_URL: postgresql+psycopg://tender:${POSTGRES_PASSWORD:-change-me}@db:5432/tender_ai
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
